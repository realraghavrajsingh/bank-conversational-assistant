<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4540"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/>
    </marker>
    <style>
      .zone { fill: none; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 14; }
      .zlabel { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .box { fill: #ffffff; stroke: #3a4540; stroke-width: 1.3; rx: 10; }
      .core { fill: #eef6f2; stroke: #0f5c4a; stroke-width: 1.6; rx: 10; }
      .ext { fill: #fdf3ee; stroke: #b5532f; stroke-width: 1.4; rx: 10; }
      .t { font-size: 14px; font-weight: 650; fill: #1d2320; }
      .s { font-size: 11.5px; fill: #4c5752; }
      .f { font-size: 11.5px; fill: #1d2320; }
      .n { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #3a4540; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .lineR { stroke: #b5532f; stroke-width: 1.4; fill: none; marker-end: url(#arrR); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#fbfaf7"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1d2320">Banking Conversational Assistant — architecture &amp; trust boundaries</text>
  <text x="30" y="60" class="s">Numbers follow one customer turn. Dashed regions are trust zones; every arrow crossing a zone edge is authenticated and validated.</text>

  <!-- Zone: customer device -->
  <rect x="30" y="90" width="230" height="520" class="zone" stroke="#8a8f8c"/>
  <text x="46" y="114" class="zlabel" fill="#6b726e">CUSTOMER · untrusted</text>
  <rect x="50" y="250" width="190" height="120" class="box"/>
  <text x="66" y="278" class="t">Chat UI</text>
  <text x="66" y="298" class="s">static/index.html (vanilla JS)</text>
  <text x="66" y="316" class="s">renders text only (no HTML)</text>
  <text x="66" y="334" class="s">bearer token in sessionStorage</text>
  <text x="66" y="352" class="s">optional tool-trace view</text>

  <rect x="50" y="440" width="190" height="90" class="box" stroke-dasharray="4 3"/>
  <text x="66" y="466" class="t">Bank IdP / app login</text>
  <text x="66" y="486" class="s">out of scope — simulated by</text>
  <text x="66" y="504" class="s">POST /api/session (demo flag)</text>

  <!-- Zone: assistant service -->
  <rect x="300" y="90" width="520" height="620" class="zone" stroke="#0f5c4a"/>
  <text x="316" y="114" class="zlabel" fill="#0f5c4a">ASSISTANT SERVICE · bank-controlled (port 8000)</text>

  <rect x="320" y="130" width="480" height="78" class="box"/>
  <text x="336" y="156" class="t">API edge  ·  Spring Boot 3.5 / Java 21</text>
  <text x="336" y="176" class="s">bearer session → customer_id · input length limit · per-session rate limit</text>
  <text x="336" y="194" class="s">one turn at a time per session (lock) · no-store / nosniff headers</text>

  <rect x="320" y="228" width="480" height="104" class="core"/>
  <text x="336" y="254" class="t">Orchestrator  ·  bounded reason–act loop</text>
  <text x="336" y="274" class="s">system prompt (scope, rules, today's date, masked accounts) + history window</text>
  <text x="336" y="292" class="s">model chooses tools from their descriptions — no keyword / if-else routing</text>
  <text x="336" y="310" class="s">max steps per turn · friendly fallbacks on model / bank failure</text>

  <rect x="570" y="352" width="230" height="168" class="core"/>
  <text x="586" y="378" class="t">Tool layer</text>
  <text x="586" y="398" class="s">7 tools, Bean Validation</text>
  <text x="586" y="416" class="s">customer_id injected from session</text>
  <text x="586" y="434" class="s">account ids checked vs. session</text>
  <text x="586" y="452" class="s">errors returned to model</text>
  <text x="586" y="470" class="s">cheque book: prepare → confirm</text>
  <text x="586" y="488" class="s">in a later turn → submit</text>
  <text x="586" y="506" class="s">(idempotency key = pending id)</text>

  <rect x="320" y="352" width="230" height="168" class="core"/>
  <text x="336" y="378" class="t">Grounding guard</text>
  <text x="336" y="398" class="s">collects every number / ref</text>
  <text x="336" y="416" class="s">returned by the bank</text>
  <text x="336" y="434" class="s">checks each reply: amounts and</text>
  <text x="336" y="452" class="s">SR-/TXN- refs must be evidenced</text>
  <text x="336" y="470" class="s">1 self-correction, then safe</text>
  <text x="336" y="488" class="s">fallback — invented figures</text>
  <text x="336" y="506" class="s">never reach the customer</text>

  <rect x="320" y="540" width="480" height="70" class="box"/>
  <text x="336" y="566" class="t">Session store (in-memory; Redis in production)</text>
  <text x="336" y="586" class="s">history · pending actions · evidence set · TTL 30 min</text>

  <rect x="320" y="630" width="480" height="62" class="box"/>
  <text x="336" y="656" class="t">LLM adapter interface</text>
  <text x="336" y="676" class="s">Gemini · OpenAI-compatible (OpenAI, Ollama, vLLM…), plain REST</text>

  <!-- Zone: external LLM -->
  <rect x="860" y="560" width="310" height="150" class="zone" stroke="#b5532f"/>
  <text x="876" y="584" class="zlabel" fill="#b5532f">MODEL PROVIDER · third party</text>
  <rect x="880" y="598" width="270" height="94" class="ext"/>
  <text x="896" y="624" class="t">LLM (tool calling)</text>
  <text x="896" y="644" class="s">sees: conversation, tool schemas,</text>
  <text x="896" y="662" class="s">tool results (masked numbers only)</text>
  <text x="896" y="680" class="s">never: credentials, full acct nos.</text>

  <!-- Zone: core banking -->
  <rect x="860" y="90" width="310" height="440" class="zone" stroke="#3a4540"/>
  <text x="876" y="114" class="zlabel" fill="#3a4540">CORE BANKING · internal network</text>
  <rect x="880" y="130" width="270" height="380" class="box"/>
  <text x="896" y="158" class="t">Mock Core Banking API</text>
  <text x="896" y="176" class="s">mock-bank (Spring Boot) · :8001 · internal</text>
  <text x="896" y="206" class="f">GET  …/accounts</text>
  <text x="896" y="226" class="f">GET  …/accounts/{id}/balance</text>
  <text x="896" y="246" class="f">GET  …/transactions?q=&amp;from=&amp;to=</text>
  <text x="896" y="266" class="f">GET  …/transactions/{id}</text>
  <text x="896" y="286" class="f">GET  …/cheque-book/eligibility</text>
  <text x="896" y="306" class="f">POST …/service-requests/cheque-book</text>
  <text x="896" y="326" class="f">GET  …/service-requests</text>
  <text x="896" y="360" class="s">X-Service-Key required (service-to-service)</text>
  <text x="896" y="378" class="s">every path scoped by customer id;</text>
  <text x="896" y="396" class="s">foreign account / txn → 404</text>
  <text x="896" y="414" class="s">balances derived from transactions</text>
  <text x="896" y="432" class="s">Idempotency-Key + one open request</text>
  <text x="896" y="450" class="s">per account enforced here too</text>
  <text x="896" y="478" class="s">synthetic seed data only</text>

  <!-- Flows -->
  <path d="M240,290 L320,170" class="line"/>
  <circle cx="270" cy="236" r="10" fill="#0f5c4a"/><text x="266.5" y="240" class="n">1</text>
  <text x="200" y="200" class="s">HTTPS /api/chat</text>

  <path d="M560,208 L560,228" class="line"/>
  <circle cx="580" cy="218" r="10" fill="#0f5c4a"/><text x="576.5" y="222" class="n">2</text>

  <path d="M800,661 L880,648" class="lineR"/>
  <path d="M880,672 L800,676" class="lineR"/>
  <circle cx="840" cy="630" r="10" fill="#b5532f"/><text x="836.5" y="634" class="n">3</text>

  <path d="M685,332 L685,352" class="line"/>
  <circle cx="705" cy="342" r="10" fill="#0f5c4a"/><text x="701.5" y="346" class="n">4</text>

  <path d="M800,420 C 840,420 840,300 880,300" class="line"/>
  <circle cx="840" cy="440" r="10" fill="#0f5c4a"/><text x="836.5" y="444" class="n">5</text>

  <path d="M570,470 L550,470" class="line"/>
  <circle cx="560" cy="440" r="10" fill="#0f5c4a"/><text x="556.5" y="444" class="n">6</text>

  <path d="M320,300 C 280,320 270,340 240,345" class="line"/>
  <circle cx="290" cy="380" r="10" fill="#0f5c4a"/><text x="286.5" y="384" class="n">7</text>

  <path d="M145,440 L145,370" class="line" stroke-dasharray="4 3"/>

  <!-- Legend -->
  <text x="30" y="748" class="t">Turn flow</text>
  <text x="30" y="768" class="s">1 message + bearer token  ·  2 session resolves customer  ·  3 prompt + tool schemas to model; it replies or picks tools</text>
  <text x="30" y="786" class="s">4 tool layer validates &amp; scopes  ·  5 bank call  ·  6 results → evidence + model  ·  7 grounded reply</text>
  <text x="30" y="804" class="s" font-style="italic">(steps 3–6 loop up to max-agent-steps)</text>
</svg>
